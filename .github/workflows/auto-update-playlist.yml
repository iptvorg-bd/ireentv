name: Auto-Update M3U Playlist

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate M3U / M3U8 Playlist
        run: node scripts/generate-playlist.js
        env:
          PLAYLIST_BASE_URL: https://ireentv.pages.dev

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u public/playlist.m3u public/playlist.m3u8
          if git diff --staged --quiet; then
            echo "No changes in playlist. Nothing to commit."
          else
            git commit -m "Auto-update dynamic M3U playlist [skip ci]"
            git push origin main || git push
          fi

